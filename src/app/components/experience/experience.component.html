<section id="experience" class="experience-section">
  <div class="container">
    <h2 class="section-title">{{ translations().experience.title }}</h2>
    <div class="timeline">
      @for (exp of translations().experience.items; track $index) {
        <div class="timeline-item" appReveal>
          <div class="timeline-marker"></div>
          <div class="timeline-content">
            <h3>{{ exp.title }}</h3>
            <h4>{{ exp.company }}</h4>
            <span class="period">{{ exp.period }}</span>
            <ul>
              @for (bullet of exp.bullets; track $index) {
                <li>{{ bullet }}</li>
              }
            </ul>
          </div>
        </div>
      }
    </div>
  </div>
</section>
