<section id="home" class="hero-section">
  <div class="hero-content">
    <div class="hero-text">
      <h1 class="hero-title">
        <span class="greeting">{{ translations().hero.greeting }}</span>
        <span class="name">{{ translations().hero.name }}</span>
        <span class="role">{{ translations().hero.role }}</span>
      </h1>
      <p class="hero-description">
        {{ translations().hero.description }}
      </p>
      <div class="hero-buttons">
        <a href="#projects" class="btn-primary">{{ translations().nav.projects }}</a>
        <a href="#contact" class="btn-secondary">{{ translations().nav.contact }}</a>
      </div>
      <ul class="hero-socials">
        <li>
          <a [href]="profile.github" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
            <span>GitHub</span>
          </a>
        </li>
        <li>
          <a [href]="profile.linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
            <span>LinkedIn</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
  <div class="scroll-indicator" aria-hidden="true">
    <div class="mouse">
      <div class="wheel"></div>
    </div>
    <p>{{ translations().hero.scrollDown }}</p>
  </div>
</section>
