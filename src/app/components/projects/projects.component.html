<section id="projects" class="projects-section">
  <div class="container">
    <h2 class="section-title">{{ translations().projects.title }}</h2>
    <div class="projects-grid">
      @for (project of projects; track project.id) {
        @let text = translations().projects.items[project.id];
        <article class="project-card" appReveal>
          <div class="project-image">
            <img
              [src]="project.image"
              [alt]="text.title"
              [width]="project.imageWidth"
              [height]="project.imageHeight"
              loading="lazy"
              decoding="async"
            >
            <div class="overlay">
              <a [href]="project.link" class="view-btn" target="_blank" rel="noopener noreferrer">
                {{ translations().projects.viewCode }}
              </a>
            </div>
          </div>
          <div class="project-content">
            <h3>{{ text.title }}</h3>
            <p>{{ text.description }}</p>
            <ul class="technologies">
              @for (tech of project.technologies; track tech) {
                <li class="tech-tag">{{ tech }}</li>
              }
            </ul>
          </div>
        </article>
      }
    </div>
  </div>
</section>
