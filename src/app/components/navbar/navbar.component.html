<nav class="navbar">
  <div class="nav-container">
    <a href="#home" class="logo" [attr.aria-label]="translations().nav.home" (click)="closeMenu()">
      Allan Salah-Djimabi
    </a>

    <button
      class="hamburger"
      type="button"
      [class.open]="menuOpen()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="nav-menu"
      [attr.aria-label]="translations().nav.menu"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul id="nav-menu" class="nav-menu" [class.open]="menuOpen()">
      <li><a href="#about" (click)="closeMenu()">{{ translations().nav.about }}</a></li>
      <li><a href="#experience" (click)="closeMenu()">{{ translations().nav.experience }}</a></li>
      <li><a href="#projects" (click)="closeMenu()">{{ translations().nav.projects }}</a></li>
      <li><a href="#contact" (click)="closeMenu()">{{ translations().nav.contact }}</a></li>
      <li>
        <button type="button" class="cv-link" (click)="openCv()">
          {{ translations().nav.cv }}
        </button>
      </li>
      <li class="lang-item">
        <button type="button" class="lang-toggle" [attr.aria-label]="translations().nav.switchLanguage" (click)="toggleLanguage()">
          {{ language() === 'en' ? 'FR' : 'EN' }}
        </button>
      </li>
    </ul>

    <button type="button" class="lang-toggle desktop-lang" [attr.aria-label]="translations().nav.switchLanguage" (click)="toggleLanguage()">
      {{ language() === 'en' ? 'FR' : 'EN' }}
    </button>
  </div>

  <div class="nav-overlay" [class.open]="menuOpen()" (click)="closeMenu()"></div>
</nav>
